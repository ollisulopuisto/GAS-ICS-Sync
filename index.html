<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --line: #d1d9e0;
        --accent: #1a7f37;
        --accent-fg: #ffffff;
        --field-bg: #ffffff;
        --warn-bg: #fff8c5;
        --warn-line: #d4a72c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9198a1;
          --line: #3d444d;
          --accent: #238636;
          --field-bg: #151b23;
          --warn-bg: #282215;
          --warn-line: #9e6a03;
        }
      }
      * { box-sizing: border-box; }
      /* The layout rules below set display, which would otherwise override [hidden] */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        padding: 24px 16px 64px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main { max-width: 780px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 32px 0 8px; }
      p.lede { color: var(--muted); margin: 0 0 24px; }
      fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0; padding: 4px 16px; }
      .row { display: flex; gap: 16px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
      .row:last-child { border-bottom: none; }
      .row label { flex: 1; }
      .row .label-text { display: block; font-weight: 600; }
      .row .description { display: block; color: var(--muted); font-size: 13px; }
      .row .control { flex: 0 0 220px; }
      input[type="text"], input[type="number"], select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--field-bg);
        color: var(--fg);
        font: inherit;
      }
      input[type="checkbox"] { width: 18px; height: 18px; }
      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 4px 6px; }
      td { padding: 4px 6px; vertical-align: top; }
      td input, td select { min-width: 0; }
      button {
        font: inherit;
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--field-bg);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
      button:disabled { opacity: .5; cursor: default; }
      .actions { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
                 padding: 16px 0; margin-top: 24px; background: var(--bg); border-top: 1px solid var(--line); }
      .status { color: var(--muted); }
      .notice { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; }
      .remove-row { padding: 4px 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Calendar sync settings</h1>
      <p class="lede">These are stored for your account only, not in the script, so they survive updates to the code.</p>

      <div id="loading">Loading…</div>
      <form id="settings-form" hidden></form>

      <div class="actions" id="actions" hidden>
        <button type="button" class="primary" id="save">Save</button>
        <button type="button" id="sync-now">Sync now</button>
        <button type="button" id="toggle-trigger"></button>
        <button type="button" id="reset">Use script defaults</button>
        <span class="status" id="status"></span>
      </div>
    </main>

    <script>
      var state = null;

      function el(tag, props, children){
        var node = Object.assign(document.createElement(tag), props || {});
        (children || []).forEach(function(child){ node.appendChild(child); });
        return node;
      }

      function setStatus(text){
        document.getElementById('status').textContent = text || '';
      }

      function busy(isBusy){
        ['save', 'sync-now', 'toggle-trigger', 'reset'].forEach(function(id){
          document.getElementById(id).disabled = isBusy;
        });
      }

      // ---------------- rendering ----------------

      function renderCalendarRows(rows){
        var body = el('tbody', { id: 'calendar-rows' });
        (rows.length ? rows : [[]]).forEach(function(row){ body.appendChild(calendarRow(row)); });
        return body;
      }

      function calendarRow(row){
        var url = el('input', { type: 'text', className: 'cal-url', value: row[0] || '', placeholder: 'https://…/calendar.ics' });
        var target = el('input', { type: 'text', className: 'cal-target', value: row[1] || '', placeholder: 'Google Calendar name' });
        var color = el('input', { type: 'text', className: 'cal-color', value: row[2] == null ? '' : row[2], placeholder: 'e.g. 11' });

        var privacy = el('select', { className: 'cal-privacy' });
        [['', 'Use the settings below'], ['true', 'Always hide details'], ['false', 'Never hide details']].forEach(function(option){
          privacy.appendChild(el('option', { value: option[0], textContent: option[1], selected: String(row[3] == null ? '' : row[3]) === option[0] }));
        });

        var remove = el('button', { type: 'button', className: 'remove-row', textContent: '✕', title: 'Remove this feed' });
        remove.addEventListener('click', function(){
          var tbody = document.getElementById('calendar-rows');
          if (tbody.rows.length > 1) remove.closest('tr').remove();
        });

        return el('tr', {}, [url, target, color, privacy, remove].map(function(field){
          return el('td', {}, [field]);
        }));
      }

      function renderCalendars(definition){
        var head = el('tr', {}, ['ICS/iCal link', 'Google Calendar', 'Colour', 'Details', ''].map(function(title){
          return el('th', { textContent: title });
        }));

        var table = el('table', {}, [el('thead', {}, [head]), renderCalendarRows(state.values.sourceCalendars || [])]);

        var add = el('button', { type: 'button', textContent: 'Add a feed', style: 'margin: 12px 0 4px' });
        add.addEventListener('click', function(){ document.getElementById('calendar-rows').appendChild(calendarRow([])); });

        return el('div', {}, [
          el('p', { className: 'description', textContent: definition.description, style: 'color: var(--muted); margin: 8px 0' }),
          table,
          add
        ]);
      }

      function renderField(definition){
        var value = state.values[definition.key];
        var control;

        if (definition.type === 'boolean'){
          control = el('input', { type: 'checkbox', id: definition.key, checked: !!value });
        }
        else if (definition.type === 'select'){
          control = el('select', { id: definition.key });
          definition.options.forEach(function(option){
            control.appendChild(el('option', {
              value: option,
              textContent: option === '' ? '(not set)' : option,
              selected: option === value
            }));
          });
        }
        else if (definition.type === 'number' || definition.type === 'nullableNumber'){
          control = el('input', { type: 'number', id: definition.key, value: value == null ? '' : value });
        }
        else {
          control = el('input', { type: 'text', id: definition.key, value: value == null ? '' : value });
        }

        var label = el('label', { htmlFor: definition.key }, [
          el('span', { className: 'label-text', textContent: definition.label }),
          el('span', { className: 'description', textContent: definition.description })
        ]);

        return el('div', { className: 'row' }, [label, el('div', { className: 'control' }, [control])]);
      }

      function render(){
        var form = document.getElementById('settings-form');
        form.textContent = '';

        if (!state.usingStoredSettings){
          form.appendChild(el('div', { className: 'notice', textContent:
            'You are currently using the settings written in the script. Saving here stores your own settings instead.' }));
        }

        var groups = [];
        state.definitions.forEach(function(definition){
          var group = groups.filter(function(g){ return g.name === definition.group; })[0];
          if (!group){
            group = { name: definition.group, definitions: [] };
            groups.push(group);
          }
          group.definitions.push(definition);
        });

        groups.forEach(function(group){
          form.appendChild(el('h2', { textContent: group.name }));
          var fieldset = el('fieldset');
          group.definitions.forEach(function(definition){
            fieldset.appendChild(definition.type === 'calendars' ? renderCalendars(definition) : renderField(definition));
          });
          form.appendChild(fieldset);
        });

        document.getElementById('toggle-trigger').textContent =
          state.triggerInstalled ? 'Turn off automatic syncing' : 'Turn on automatic syncing';

        document.getElementById('loading').hidden = true;
        form.hidden = false;
        document.getElementById('actions').hidden = false;
      }

      // ---------------- collecting ----------------

      function collect(){
        var values = {};

        state.definitions.forEach(function(definition){
          if (definition.type === 'calendars'){
            values[definition.key] = Array.prototype.map.call(
              document.getElementById('calendar-rows').rows,
              function(row){
                return {
                  url: row.querySelector('.cal-url').value.trim(),
                  target: row.querySelector('.cal-target').value.trim(),
                  color: row.querySelector('.cal-color').value.trim(),
                  privacy: row.querySelector('.cal-privacy').value
                };
              }
            );
            return;
          }

          var field = document.getElementById(definition.key);
          values[definition.key] = definition.type === 'boolean' ? field.checked : field.value;
        });

        return values;
      }

      // ---------------- server calls ----------------

      function onState(message){
        return function(newState){
          state = newState;
          render();
          busy(false);
          setStatus(message);
        };
      }

      function onError(error){
        busy(false);
        setStatus('Something went wrong: ' + error.message);
      }

      document.getElementById('save').addEventListener('click', function(){
        busy(true);
        setStatus('Saving…');
        google.script.run.withSuccessHandler(onState('Saved.')).withFailureHandler(onError).saveSettingsFromUi(collect());
      });

      document.getElementById('reset').addEventListener('click', function(){
        if (!confirm('Forget your stored settings and use the values written in the script?')) return;
        busy(true);
        setStatus('Resetting…');
        google.script.run.withSuccessHandler(onState('Using the script defaults again.')).withFailureHandler(onError).resetSettingsFromUi();
      });

      document.getElementById('sync-now').addEventListener('click', function(){
        busy(true);
        setStatus('Starting…');
        google.script.run
          .withSuccessHandler(function(message){ busy(false); setStatus(message); })
          .withFailureHandler(onError)
          .runSyncNowFromUi();
      });

      document.getElementById('toggle-trigger').addEventListener('click', function(){
        busy(true);
        setStatus('Working…');
        var handler = function(){
          google.script.run.withSuccessHandler(onState('Done.')).withFailureHandler(onError).getSettingsForUi();
        };
        var call = google.script.run.withSuccessHandler(handler).withFailureHandler(onError);
        state.triggerInstalled ? call.uninstallFromUi() : call.installFromUi();
      });

      google.script.run.withSuccessHandler(onState('')).withFailureHandler(onError).getSettingsForUi();
    </script>
  </body>
</html>
